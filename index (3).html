<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RetroCam – Digital Camera with Manual Controls</title>
<style>
:root{--bg:#f4f2ee;--fg:#16151a;--mut:#6b6872;--card:#fff;--bd:#dcd8d0;--acc:#e0245e;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d12;--fg:#f1f0f5;--mut:#8b8996;--card:#17171f;--bd:#2a2a36;--acc:#ff4d8d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d12;--fg:#f1f0f5;--mut:#8b8996;--card:#17171f;--bd:#2a2a36;--acc:#ff4d8d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{--or:#f2a125}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:520px;margin:0 auto;padding:12px}
.cam{--sc:#9a9aa0;display:grid;grid-template-columns:1fr 46px;border-radius:20px;overflow:hidden;background:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.5px) 0 0/5px 5px,#1b1b1d;box-shadow:0 14px 34px rgba(0,0,0,.4);border:1px solid #000}
.main{padding:16px 10px 16px 16px}
.dials{display:flex;align-items:center;justify-content:space-around;margin:0 0 14px}
.dl{width:62px;height:62px;border-radius:50%;border:0;padding:0;background:repeating-conic-gradient(#6a6a70 0 3deg,#26262a 3deg 6deg);position:relative;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.6)}
.dl:after{content:"";position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3a3a40,#0e0e10);border:1px solid #555}
div.dl:after{inset:14px;background:radial-gradient(circle,#555 0 20%,#0a0a0c 22%)}
.ev b{position:relative;z-index:1;color:#aaa;font:700 10px system-ui;letter-spacing:1px}
.lv{width:46px;height:14px;border-radius:7px;border:0;background:linear-gradient(#d9d9de,#7d7d84);box-shadow:0 2px 4px rgba(0,0,0,.6);transform:rotate(-25deg);cursor:pointer}
#st{position:relative;background:#000;border-radius:12px;border:6px solid #2b2b2f;box-shadow:0 0 0 2px #0a0a0a;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:220px}
#cv{max-width:100%;max-height:56vh;width:auto;height:auto;display:block}
.strip{background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.4) 50%,rgba(0,0,0,.25)),var(--sc);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:14px}
#cm{writing-mode:vertical-rl;font:700 22px system-ui,sans-serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);letter-spacing:1px}
.led{width:9px;height:9px;border-radius:50%;background:#3a3;box-shadow:0 0 6px #3f3}
.led.r{background:#f22;box-shadow:0 0 8px #f22}
.osd{position:absolute;inset:0;pointer-events:none;color:#fff;font:600 12px/1 ui-monospace,Menlo,Consolas,monospace;text-shadow:0 1px 2px #000;padding:8px;display:flex;flex-direction:column;justify-content:space-between}
.osd>div{display:flex;justify-content:space-between;align-items:center;gap:8px}
.osd .m{justify-content:center}
.af{width:80px;height:62px;border:2px solid rgba(255,255,255,.75);border-radius:4px}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;background:#000}
#ov[hidden]{display:none}
#ov button,#ov label{font:inherit;color:#fff;background:#333;border:1px solid #555;border-radius:20px;padding:9px 16px;cursor:pointer}
#go{background:var(--or)!important;border-color:var(--or)!important}
.ctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:14px 0 0}
.imp{justify-self:start;display:flex;align-items:center;gap:8px;cursor:pointer}
.imp i{width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-style:normal;font-size:20px;line-height:1}
#sh{width:76px;height:76px;border-radius:50%;border:5px solid var(--bd);background:radial-gradient(circle at 35% 30%,#ffc457,#f2a125 60%,#c47a0a);box-shadow:0 4px 10px rgba(0,0,0,.3);padding:0;cursor:pointer;transition:border-radius .15s}
#sh.rec{border-radius:20px;background:#e0243a}
.sw{justify-self:end;display:flex;border:1px solid var(--bd);border-radius:20px;overflow:hidden;background:var(--card)}
.sw button{font:inherit;font-size:13px;color:var(--fg);background:none;border:0;padding:8px 12px;cursor:pointer}
.sw button.on{background:var(--fg);color:var(--bg)}
.sw .dis{opacity:.35}
.sheet{background:var(--card);border:1px solid var(--bd);border-radius:24px 24px 0 0;padding:10px 14px 18px;margin-top:16px}
.hd{width:140px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 6px}
.sh2{font-size:13px;color:var(--mut);margin:14px 4px 2px;display:flex;align-items:center;gap:10px}
.sh2:after{content:"";flex:1;height:1px;background:var(--bd)}
.sh2.g{margin-top:22px}
.row{display:flex;gap:4px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.cm{flex:0 0 80px;background:none;border:0;color:var(--fg);font:14px system-ui,sans-serif;cursor:pointer;padding:0;text-align:center}
.cm svg{width:60px;height:60px;display:block;margin:0 auto 6px}
.cm span{display:inline-block;padding:3px 10px;border-radius:14px;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm.on span{background:var(--fg);color:var(--bg)}
.nv{display:flex;gap:6px}
.nv button{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:50%;width:28px;height:28px;cursor:pointer;padding:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.tabs button{flex:none;font:inherit;font-size:13px;color:var(--fg);background:none;border:1px solid var(--bd);border-radius:16px;padding:5px 12px;cursor:pointer}
.tabs button.on{background:var(--or);border-color:var(--or);color:#fff}
#fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding-top:4px}
#fl button{font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 6px;cursor:pointer}
#fl button.on{background:var(--or);border-color:var(--or);color:#fff;font-weight:600}
.dsl{display:flex;gap:8px;align-items:center;margin:14px 4px 0;font-size:13px;color:var(--mut)}
#gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.it{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;font-size:13px}
.it img,.it video{width:100%;display:block}
.it a{display:block;text-align:center;padding:8px;color:var(--or);font-weight:600;text-decoration:none}
.wm{margin:28px 0 8px;padding-top:14px;border-top:1px solid var(--bd);text-align:center;font:600 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--mut);opacity:.8}

.plate{display:flex;justify-content:space-between;align-items:center;margin:-4px 2px 10px;font:800 15px/1 "Arial Black",system-ui,sans-serif;letter-spacing:3px;color:#cfcfd4;text-shadow:0 1px 0 #000}
.plate span{font:600 9px system-ui;letter-spacing:2px;color:#8a8a90}
.plate i{width:10px;height:10px;border-radius:50%;background:#d3202f;box-shadow:0 0 0 2px #0008}
.deck{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center;margin:0 0 12px}
.lcd{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:#17110a;border:3px solid #2b2b2f;border-radius:8px;padding:4px}
.lcd button{background:transparent;border:1px solid transparent;border-radius:4px;color:#ffb000;font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;padding:3px 0;cursor:pointer;line-height:1.15}
.lcd small{display:block;font-size:9px;opacity:.6;letter-spacing:1px}
.lcd b{font-size:12px;text-shadow:0 0 6px rgba(255,176,0,.5)}
.lcd button.on{border-color:#ffb000;background:rgba(255,176,0,.14)}
.whl{width:68px;height:68px;border-radius:50%;background:repeating-conic-gradient(#7a7a80 0 3deg,#26262a 3deg 6deg);position:relative;touch-action:none;cursor:ew-resize;box-shadow:0 3px 6px rgba(0,0,0,.6);transition:transform .08s}
.whl:after{content:"◀ ▶";position:absolute;inset:11px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3a3a40,#0e0e10);border:1px solid #555;display:grid;place-items:center;color:#999;font-size:9px;letter-spacing:3px}
.af{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
#hist{position:absolute;top:34px;right:8px;border-radius:3px;pointer-events:none}
#cd{position:absolute;inset:0;display:grid;place-items:center;font:700 96px system-ui;color:#fff;text-shadow:0 2px 12px #000;pointer-events:none}
#cd:empty{display:none}
.gridl{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent calc(33.3% - .5px),rgba(255,255,255,.45) 0 calc(33.3% + .5px),transparent 0 calc(66.6% - .5px),rgba(255,255,255,.45) 0 calc(66.6% + .5px),transparent 0),linear-gradient(0deg,transparent calc(33.3% - .5px),rgba(255,255,255,.45) 0 calc(33.3% + .5px),transparent 0 calc(66.6% - .5px),rgba(255,255,255,.45) 0 calc(66.6% + .5px),transparent 0)}
.gridl[hidden],#hist[hidden]{display:none}
</style></head><body>
<div class="w">
<div class="cam"><div class="main">
<div class="plate">RETROCAM<span>MARK II · 12.0 MP · 28 LENSES</span><i></i></div><div class="dials"><div class="dl"></div><button class="dl ev" onclick="selP('ev')" aria-label="Exposure compensation"><b>EV</b></button><button class="lv" id="fp" aria-label="Flip camera"></button></div>
<div class="deck"><div class="lcd" id="lcd"></div><div class="whl" id="wh" aria-label="Control wheel"></div></div>
<div id="st"><canvas id="cv" width="640" height="480"></canvas>
<div class="osd"><div><span id="cn"></span><span><span id="tm"></span> ▮▮▮</span></div><div class="m"></div><div><span id="md">PHOTO</span><span id="sc">SHOTS 0000</span><span id="dt"></span></div></div><canvas id="hist" width="96" height="40" hidden></canvas><div class="gridl" id="grid" hidden></div><div class="af" id="af"></div><div id="cd"></div>
<div id="ov"><div id="msg">Power on to start the camera.</div><button id="go">Power on</button><label>Or import a photo / video<input class="up" type="file" accept="image/*,video/*" hidden></label></div></div>
</div><div class="strip"><i class="led" id="led"></i><span id="cm">Classic M</span></div></div>
<div class="ctl"><label class="imp"><i>+</i>Import<input class="up" type="file" accept="image/*,video/*" hidden></label><button id="sh" aria-label="Shutter"></button><div class="sw"><button id="m1" class="on">Photo</button><button id="m2">Video</button></div></div>
<div class="sheet"><div class="hd"></div>
<div class="sh2">Film &amp; Instant</div><div class="row" id="r1"></div>
<div class="sh2">Digital &amp; Camcorder</div><div class="row" id="r2"></div>
<div class="sh2">FX Menu <span class="nv"><button id="pv" aria-label="Previous filter">‹</button><button id="nx" aria-label="Next filter">›</button></span></div>
<div class="tabs" id="tb"></div><div id="fl"></div>
<label class="dsl"><input type="checkbox" id="ds"> Burn date stamp into captures</label></div>
<div class="sh2 g">Memory Card</div><div id="gl"></div>
<footer class="wm">Made by Raghav Upadhyay · 2026</footer>
</div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),g=cv.getContext('2d',{willReadFrequently:true}),R=Math.random;
const vid=document.createElement('video');vid.playsInline=true;vid.muted=true;
const tc=document.createElement('canvas'),tg=tc.getContext('2d'),pv=document.createElement('canvas'),pg=pv.getContext('2d');
let W=640,H=480,lw=0,lh=0,img=null,facing='user',stream=null,isCam=true,cur=1,mode='photo',drops=[],rec,chunks=[],tm,sec=0;
const P=f=>{const im=g.getImageData(0,0,W,H),d=im.data;for(let y=0,i=0;y<H;y++)for(let x=0;x<W;x++,i+=4)f(d,i,x,y);g.putImageData(im,0,0)};
const lum=(d,i)=>.299*d[i]+.587*d[i+1]+.114*d[i+2];
const grain=a=>P((d,i)=>{const n=(R()-.5)*a;d[i]+=n;d[i+1]+=n;d[i+2]+=n});
const ca=dx=>{dx=Math.round(dx);const im=g.getImageData(0,0,W,H),d=im.data,s=new Uint8ClampedArray(d);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4,a=(y*W+Math.max(0,x-dx))*4,b=(y*W+Math.min(W-1,x+dx))*4;d[i]=s[a];d[i+2]=s[b+2]}g.putImageData(im,0,0)};
const scan=(a,s)=>{g.fillStyle=`rgba(0,0,0,${a})`;for(let y=0;y<H;y+=s)g.fillRect(0,y,W,1)};
const vig=a=>{const r=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,W*.7);r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,`rgba(0,0,0,${a})`);g.fillStyle=r;g.fillRect(0,0,W,H)};
const tint=(c,op='overlay')=>{g.globalCompositeOperation=op;g.fillStyle=c;g.fillRect(0,0,W,H);g.globalCompositeOperation='source-over'};
const soft=(s,op,a)=>{tc.width=W/s|0;tc.height=H/s|0;tg.drawImage(cv,0,0,tc.width,tc.height);g.globalCompositeOperation=op;g.globalAlpha=a;g.drawImage(tc,0,0,W,H);g.globalCompositeOperation='source-over';g.globalAlpha=1};
const pix=s=>{tc.width=W/s|0;tc.height=H/s|0;tg.drawImage(cv,0,0,tc.width,tc.height);g.imageSmoothingEnabled=false;g.drawImage(tc,0,0,W,H);g.imageSmoothingEnabled=true};
const copy=()=>{tc.width=W;tc.height=H;tg.drawImage(cv,0,0)};
const scr=n=>{for(let k=0;k<n;k++)if(R()<.4){g.fillStyle='rgba(255,255,255,.25)';g.fillRect(R()*W,0,1,H)}};
const edge=(th,c)=>{const im=g.getImageData(0,0,W,H),d=im.data,s=new Uint8ClampedArray(d);for(let y=0;y<H-1;y++)for(let x=0;x<W-1;x++){const i=(y*W+x)*4,l=lum(s,i);if(Math.abs(l-lum(s,i+4))+Math.abs(l-lum(s,i+W*4))>th){d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2]}}g.putImageData(im,0,0)};
const lut=s=>{const L=new Uint8Array(768);for(let v=0;v<256;v++){const t=v/255*(s.length-1),k=Math.min(s.length-2,t|0),f=t-k;for(let c=0;c<3;c++)L[v*3+c]=s[k][c]+(s[k+1][c]-s[k][c])*f}return L};
const mapL=L=>P((d,i)=>{const v=lum(d,i)|0;d[i]=L[v*3];d[i+1]=L[v*3+1];d[i+2]=L[v*3+2]});
const LT={green:lut([[0,12,2],[30,255,90]]),riso:lut([[15,30,140],[255,80,150],[255,240,215]]),tin:lut([[20,14,8],[130,115,95],[232,214,180]]),heat:lut([[0,0,40],[80,0,160],[230,40,60],[255,180,0],[255,255,230]])};
const bay=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const F=[
['Original',()=>{}],
['CRT Monitor',()=>{ca(2);soft(6,'screen',.35);scan(.3,3);vig(.6);tint(`rgba(255,255,255,${R()*.05})`,'source-over')}],
['VHS Tape',t=>{for(let y=0;y<H;y+=4)g.drawImage(cv,0,y,W,4,Math.sin(y*.03+t*4)*3+(R()<.02?R()*30:0),y,W,4);ca(3);grain(45);scan(.15,2);g.fillStyle='rgba(255,255,255,.18)';g.fillRect(0,(t*120)%(H+60)-30,W,14);tint('rgba(80,60,160,.12)')}],
['NTSC Broadcast',()=>{soft(2,'source-over',.45);ca(4);P((d,i)=>{const l=lum(d,i);for(let c=0;c<3;c++)d[i+c]=l+(d[i+c]-l)*1.4});grain(30);scan(.12,2)}],
['1-Bit Dither',()=>P((d,i,x,y)=>{const v=lum(d,i)>(bay[(y&3)*4+(x&3)]+.5)*16;d[i]=v?235:12;d[i+1]=v?240:14;d[i+2]=v?225:12})],
['Posterize',()=>{P((d,i)=>{const l=lum(d,i);for(let c=0;c<3;c++)d[i+c]=Math.round((l+(d[i+c]-l)*1.5)/85)*85})}],
['Green Terminal',()=>{mapL(LT.green);soft(5,'screen',.4);scan(.4,2);vig(.5)}],
['Chromatic Aberration',t=>ca(8+Math.sin(t*2)*5)],
['Glam Bloom',()=>{soft(8,'screen',.8);soft(3,'screen',.25);tint('rgba(255,170,210,.15)')}],
['Digital Glitch',()=>{for(let k=0;k<7;k++)if(R()<.6){const w=R()*W*.6,h=4+R()*40,x=R()*(W-w),y=R()*(H-h);g.drawImage(cv,x,y,w,h,x+(R()-.5)*90,y,w,h)}if(R()<.5)ca(6+R()*10)}],
['Analog Glitch',()=>{for(let y=0;y<H;y+=2)if(R()<.04)g.drawImage(cv,0,y,W,2,(R()-.5)*50,y,W,2);ca(3);grain(35);scan(.2,2);if(R()<.3){g.fillStyle='rgba(255,255,255,.25)';g.fillRect(0,R()*H,W,2)}}],
['Webcam ’95',()=>{pix(4);P((d,i)=>{for(let c=0;c<3;c++)d[i+c]=Math.round(d[i+c]/48)*48});g.fillStyle='#fff';g.font='bold 14px monospace';g.fillText('● CAM 01  '+new Date().toLocaleTimeString(),10,H-12)}],
['Code Rain',()=>{P((d,i)=>{const l=lum(d,i)*.55;d[i]=0;d[i+1]=l;d[i+2]=l*.3});const n=Math.ceil(W/14);if(drops.length!==n)drops=Array.from({length:n},()=>R()*H/14);g.font='14px monospace';for(let i=0;i<n;i++){const h=drops[i]|0;for(let k=0;k<14;k++){g.fillStyle=k?`rgba(0,255,70,${1-k/14})`:'#dfffe6';g.fillText(String.fromCharCode(0x30A0+((i*7+h-k)*13%96)),i*14,(h-k)*14)}drops[i]+=.4+(i%5)*.1;if(drops[i]>H/14+14)drops[i]=0}}],
['CRT Power Off',t=>{const p=(t%5)/5;ca(2);scan(.3,3);vig(.5);if(p>.78){const k=(p-.78)/.22;copy();g.fillStyle='#000';g.fillRect(0,0,W,H);const sy=Math.max(.006,1-k*1.4),sx=k>.7?Math.max(.02,1-(k-.7)*3.3):1;g.globalAlpha=Math.max(0,1-Math.max(0,k-.85)*6);g.drawImage(tc,W*(1-sx)/2,H*(1-sy)/2,W*sx,H*sy);if(k>.5){g.fillStyle='rgba(255,255,255,.85)';g.fillRect(W*(1-sx)/2,H/2-1.5,W*sx,3)}g.globalAlpha=1}}],
['Pop Art Halftone',()=>{const d=g.getImageData(0,0,W,H).data,s=8;g.fillStyle='#ffd23f';g.fillRect(0,0,W,H);g.fillStyle='#e8176b';for(let y=0;y<H;y+=s)for(let x=0;x<W;x+=s){const l=lum(d,((y+4)*W+x+4)*4)/255;g.beginPath();g.arc(x+4,y+4,(1-l)*s*.75+.5,0,7);g.fill()}}],
['Pulp Comic',()=>{P((d,i)=>{const l=lum(d,i);for(let c=0;c<3;c++)d[i+c]=Math.round((l+(d[i+c]-l)*1.5)/64)*64});edge(55,[15,10,25]);tint('rgba(255,220,120,.12)')}],
['70s Magazine',()=>{P((d,i)=>{d[i]=d[i]*1.1+22;d[i+1]=d[i+1]*.95+14;d[i+2]=d[i+2]*.8+10});grain(22);vig(.35)}],
['Risograph',()=>{mapL(LT.riso);grain(28)}],
